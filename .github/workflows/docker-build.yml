name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deployment)'
        required: false
        default: false
        type: boolean
      skip_approval:
        description: 'Skip manual approval'
        required: false
        default: false
        type: boolean

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [code-quality]
    if: always() && (success() || github.event.inputs.skip_tests == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level moderate || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Next.js app and Nginx via Docker Compose
        run: docker compose build

  approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: [build, security]
    environment: production-approval
    if: github.event.inputs.skip_approval != 'true'
    steps:
      - name: Manual approval checkpoint
        run: |
          echo "Manual approval required for deployment"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, approval]
    environment: production
    if: always() && (needs.approval.result == 'success' || github.event.inputs.skip_approval == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate Deployment Process
        run: |
          echo "Simulating SSH into remote server..."
          echo "Pulling latest docker images..."
          echo "Running 'docker compose up -d'..."
          echo "Deployment successful!"

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker Compose Stack (Simulated Prod)
        run: docker compose up -d

      - name: Wait for service to be ready
        run: |
          echo "Waiting for services to spin up..."
          sleep 15

      - name: Run Health Checks
        run: |
          echo "Checking Nginx reverse proxy..."
          curl -f http://localhost:80 || exit 1
          echo "Checking Next.js directly..."
          curl -f http://localhost:3000 || exit 1

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: always()
    steps:
      - name: Deployment notification
        run: |
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          SMOKE_STATUS="${{ needs.smoke-tests.result }}"

          if [[ "$DEPLOY_STATUS" == "success" && "$SMOKE_STATUS" == "success" ]]; then
            echo "Production deployment successful!"
            echo "Status: DEPLOYED"
          elif [[ "$DEPLOY_STATUS" == "failure" ]]; then
            echo "Production deployment failed!"
            echo "Status: FAILED"
          else
            echo "Production deployment completed with issues!"
            echo "Status: PARTIAL"
          fi

          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release-notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD~10..HEAD)
          fi

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "## Changes" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## Deployment Info" >> $GITHUB_OUTPUT
          echo "- Deployed at: $(date -u)" >> $GITHUB_OUTPUT
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: ${{ steps.release-notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: false
